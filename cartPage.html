<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/Image/home1.jpg" type="image/x-icon">
    <title>Shopping Cart | Delicious City</title>
    <link rel="stylesheet" href="/css/cart-style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="/index.html">
            <div class="logo">
                <h3>Delicious<span>City</span></h3>
            </div>
        </a>

        <div class="header-right">
            <div class="cart-icon" id="cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Cart Container -->
    <div class="cart-container">
        <h1 class="page-title">Shopping Cart</h1>

        <!-- Empty Cart Message -->
        <div class="empty-cart" id="empty-cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <h2>Your cart is empty</h2>
            <p>Add some delicious items to get started!</p>
            <a href="/veg-index.html" class="back-btn">Continue Shopping</a>
        </div>

        <!-- Order Summary -->
        <div class="order-summary" id="order-summary" style="display: none;">
            <h2 class="summary-header">Order Summary</h2>

            <div class="summary-table-header">
                <div></div>
                <div>Product Title</div>
                <div>Price</div>
                <div style="text-align: center;">Quantity</div>
                <div style="text-align: right;">Total</div>
            </div>

            <div id="cart-items"></div>

            <div class="total-section">
                <div class="total-quantity">
                    <span>Total</span>
                    <span id="total-items">0</span>
                </div>
                <div class="total-price" id="total-price">৳0.00</div>
            </div>

            <div class="action-buttons">
                <button class="clear-btn" id="clear-cart">
                    <i class="fa-solid fa-trash"></i> Clear Cart
                </button>
                <button class="checkout-btn" id="checkout-btn">
                    <a href="/contact.html">Proceed to Buy</a>
                </button>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <!-- Cart Script -->
    <script src="javascript/cart.js"></script>

</body>
</html>
